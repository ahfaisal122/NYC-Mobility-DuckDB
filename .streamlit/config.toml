[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f6f6f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
borderColor = "#e7e6e2"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#111110"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2b2b29"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70"]
